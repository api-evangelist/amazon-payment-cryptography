  schemas:
    InternalServerException: {}
    ThrottlingException: {}
    ServiceUnavailableException: {}
    Alias:
      type: object
      required:
      - AliasName
      properties:
        AliasName:
          allOf:
          - $ref: '#/components/schemas/AliasName'
          - description: <p>A friendly name that you can use to refer to a key. The value must begin with <code>alias/</code>.</p> <important> <p>Do not include confidential or sensitive information in this field. This field may be displayed in plaintext in CloudTrail logs and other output.</p> </important>
        KeyArn:
          allOf:
          - $ref: '#/components/schemas/KeyArn'
          - description: The <code>KeyARN</code> of the key associated with the alias.
      description: Contains information about an alias.
    KeyArn:
      type: string
      pattern: ^arn:aws:payment-cryptography:[a-z]{2}-[a-z]{1,16}-[0-9]+:[0-9]{12}:key/[0-9a-zA-Z]{16,64}$
      minLength: 70
      maxLength: 150
    ListAliasesOutput:
      type: object
      required:
      - Aliases
      properties:
        Aliases:
          allOf:
          - $ref: '#/components/schemas/Aliases'
          - description: The list of aliases. Each alias describes the <code>KeyArn</code> contained within.
        NextToken:
          allOf:
          - $ref: '#/components/schemas/NextToken'
          - description: The token for the next set of results, or an empty or null value if there are no more results.
    MaxResults:
      type: integer
      minimum: 1
      maximum: 100
    Aliases:
      type: array
      items:
        $ref: '#/components/schemas/Alias'
    ResourceNotFoundException: {}
    AccessDeniedException: {}
    NextToken:
      type: string
      minLength: 1
      maxLength: 8192
    AliasName:
      type: string
      pattern: ^alias/[a-zA-Z0-9/_-]+$
      minLength: 7
      maxLength: 256
    ValidationException: {}
    ListAliasesInput:
      type: object
      title: ListAliasesInput
      properties:
        MaxResults:
          allOf:
          - $ref: '#/components/schemas/MaxResults'
          - description: <p>Use this parameter to specify the maximum number of items to return. When this value is present, Amazon Web Services Payment Cryptography does not return more than the specified number of items, but it might return fewer.</p> <p>This value is optional. If you include a value, it must be between 1 and 100, inclusive. If you do not include a value, it defaults to 50.</p>
        NextToken:
          allOf:
          - $ref: '#/components/schemas/NextToken'
          - description: Use this parameter in a subsequent request after you receive a response with truncated results. Set it to the value of <code>NextToken</code> from the truncated response you just received.
