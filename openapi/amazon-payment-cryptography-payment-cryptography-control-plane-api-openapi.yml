    ResourceArn:
      type: string
      pattern: ^arn:aws:payment-cryptography:[a-z]{2}-[a-z]{1,16}-[0-9]+:[0-9]{12}:key/[0-9a-zA-Z]{16,64}$
      minLength: 70
      maxLength: 150
    PrimitiveBoolean:
      type: boolean
    ListKeysOutput:
      type: object
      required:
      - Keys
      properties:
        Keys:
          allOf:
          - $ref: '#/components/schemas/KeySummaryList'
          - description: The list of keys created within the caller's Amazon Web Services account and Amazon Web Services Region.
        NextToken:
          allOf:
          - $ref: '#/components/schemas/NextToken'
          - description: The token for the next set of results, or an empty or null value if there are no more results.
    ImportTokenId:
      type: string
      pattern: ^import-token-[0-9a-zA-Z]{16,64}$
    CreateAliasInput:
      type: object
      required:
      - AliasName
      title: CreateAliasInput
      properties:
        AliasName:
          allOf:
          - $ref: '#/components/schemas/AliasName'
          - description: <p>A friendly name that you can use to refer a key. An alias must begin with <code>alias/</code> followed by a name, for example <code>alias/ExampleAlias</code>. It can contain only alphanumeric characters, forward slashes (/), underscores (_), and dashes (-).</p> <important> <p>Don't include confidential or sensitive information in this field. This field may be displayed in plaintext in CloudTrail logs and other output.</p> </important>
        KeyArn:
          allOf:
          - $ref: '#/components/schemas/KeyArn'
          - description: The <code>KeyARN</code> of the key to associate with the alias.
    KeyClass:
      type: string
      enum:
      - SYMMETRIC_KEY
      - ASYMMETRIC_KEY_PAIR
      - PRIVATE_KEY
      - PUBLIC_KEY
