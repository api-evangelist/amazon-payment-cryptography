components:
  parameters:
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
  schemas:
    KeyAlgorithm:
      type: string
      enum:
      - TDES_2KEY
      - TDES_3KEY
      - AES_128
      - AES_192
      - AES_256
      - RSA_2048
      - RSA_3072
      - RSA_4096
    KeyModesOfUse:
      type: object
      properties:
        Decrypt:
          allOf:
          - $ref: '#/components/schemas/PrimitiveBoolean'
          - description: Speciﬁes whether an Amazon Web Services Payment Cryptography key can be used to decrypt data.
        DeriveKey:
          allOf:
          - $ref: '#/components/schemas/PrimitiveBoolean'
          - description: Speciﬁes whether an Amazon Web Services Payment Cryptography key can be used to derive new keys.
        Encrypt:
          allOf:
          - $ref: '#/components/schemas/PrimitiveBoolean'
          - description: Speciﬁes whether an Amazon Web Services Payment Cryptography key can be used to encrypt data.
        Generate:
          allOf:
          - $ref: '#/components/schemas/PrimitiveBoolean'
          - description: Speciﬁes whether an Amazon Web Services Payment Cryptography key can be used to generate and verify other card and PIN verification keys.
        NoRestrictions:
          allOf:
          - $ref: '#/components/schemas/PrimitiveBoolean'
          - description: Speciﬁes whether an Amazon Web Services Payment Cryptography key has no special restrictions other than the restrictions implied by <code>KeyUsage</code>.
        Sign:
          allOf:
          - $ref: '#/components/schemas/PrimitiveBoolean'
          - description: Speciﬁes whether an Amazon Web Services Payment Cryptography key can be used for signing.
        Unwrap:
          allOf:
          - $ref: '#/components/schemas/PrimitiveBoolean'
          - description: Speciﬁes whether an Amazon Web Services Payment Cryptography key can be used to unwrap other keys.
        Verify:
          allOf:
          - $ref: '#/components/schemas/PrimitiveBoolean'
          - description: Speciﬁes whether an Amazon Web Services Payment Cryptography key can be used to verify signatures.
        Wrap:
          allOf:
          - $ref: '#/components/schemas/PrimitiveBoolean'
          - description: Speciﬁes whether an Amazon Web Services Payment Cryptography key can be used to wrap other keys.
      description: The list of cryptographic operations that you can perform using the key. The modes of use are deﬁned in section A.5.3 of the TR-31 spec.
    CreateAliasOutput:
      type: object
      required:
      - Alias
      properties:
        Alias:
          allOf:
          - $ref: '#/components/schemas/Alias'
          - description: The alias for the key.
    UntagResourceOutput:
      type: object
      properties: {}
    DeleteAliasOutput:
      type: object
      properties: {}
    KeyState:
      type: string
      enum:
      - CREATE_IN_PROGRESS
      - CREATE_COMPLETE
      - DELETE_PENDING
      - DELETE_COMPLETE
      description: Defines the state of a key
    ListAliasesOutput:
      type: object
      required:
      - Aliases
      properties:
        Aliases:
          allOf:
          - $ref: '#/components/schemas/Aliases'
          - description: The list of aliases. Each alias describes the <code>KeyArn</code> contained within.
        NextToken:
          allOf:
          - $ref: '#/components/schemas/NextToken'
          - description: The token for the next set of results, or an empty or null value if there are no more results.
    DeleteAliasInput:
      type: object
      required:
      - AliasName
      title: DeleteAliasInput
      properties:
        AliasName:
          allOf:
          - $ref: '#/components/schemas/AliasName'
          - description: A friendly name that you can use to refer Amazon Web Services Payment Cryptography key. This value must begin with <code>alias/</code> followed by a name, such as <code>alias/ExampleAlias</code>.
    Alias:
      type: object
      required:
      - AliasName
      properties:
        AliasName:
          allOf:
          - $ref: '#/components/schemas/AliasName'
          - description: <p>A friendly name that you can use to refer to a key. The value must begin with <code>alias/</code>.</p> <important> <p>Do not include confidential or sensitive information in this field. This field may be displayed in plaintext in CloudTrail logs and other output.</p> </important>
        KeyArn:
          allOf:
          - $ref: '#/components/schemas/KeyArn'
          - description: The <code>KeyARN</code> of the key associated with the alias.
      description: Contains information about an alias.
    KeySummaryList:
      type: array
      items:
        $ref: '#/components/schemas/KeySummary'
    ListTagsForResourceInput:
      type: object
      required:
      - ResourceArn
      title: ListTagsForResourceInput
      properties:
        MaxResults:
          allOf:
          - $ref: '#/components/schemas/MaxResults'
          - description: Use this parameter to specify the maximum number of items to return. When this value is present, Amazon Web Services Payment Cryptography does not return more than the specified number of items, but it might return fewer.
        NextToken:
          allOf:
          - $ref: '#/components/schemas/NextToken'
          - description: Use this parameter in a subsequent request after you receive a response with truncated results. Set it to the value of <code>NextToken</code> from the truncated response you just received.
        ResourceArn:
          allOf:
          - $ref: '#/components/schemas/ResourceArn'
          - description: The <code>KeyARN</code> of the key whose tags you are getting.
    GetKeyInput:
      type: object
      required:
      - KeyIdentifier
      title: GetKeyInput
      properties:
        KeyIdentifier:
          allOf:
          - $ref: '#/components/schemas/KeyArnOrKeyAliasType'
          - description: The <code>KeyARN</code> of the Amazon Web Services Payment Cryptography key.
    StopKeyUsageInput:
      type: object
      required:
      - KeyIdentifier
      title: StopKeyUsageInput
      properties:
        KeyIdentifier:
          allOf:
          - $ref: '#/components/schemas/KeyArnOrKeyAliasType'
          - description: The <code>KeyArn</code> of the key.
    GetParametersForExportOutput:
      type: object
      required:
      - ExportToken
      - ParametersValidUntilTimestamp
      - SigningKeyAlgorithm
      - SigningKeyCertificate
      - SigningKeyCertificateChain
      properties:
        ExportToken:
          allOf:
          - $ref: '#/components/schemas/ExportTokenId'
          - description: The export token to initiate key export from Amazon Web Services Payment Cryptography. The export token expires after 7 days. You can use the same export token to export multiple keys from the same service account.
        ParametersValidUntilTimestamp:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: The validity period of the export token.
        SigningKeyAlgorithm:
          allOf:
          - $ref: '#/components/schemas/KeyAlgorithm'
          - description: The algorithm of the signing key certificate for use in TR-34 key block generation. <code>RSA_2048</code> is the only signing key algorithm allowed.
        SigningKeyCertificate:
          allOf:
          - $ref: '#/components/schemas/CertificateType'
          - description: The signing key certificate of the public key for signature within the TR-34 key block cryptogram. The certificate expires after 7 days.
        SigningKeyCertificateChain:
          allOf:
          - $ref: '#/components/schemas/CertificateType'
          - description: The certificate chain that signed the signing key certificate. This is the root certificate authority (CA) within your service account.
    ExportTr31KeyBlock:
      type: object
      required:
      - WrappingKeyIdentifier
      properties:
        WrappingKeyIdentifier:
          allOf:
          - $ref: '#/components/schemas/KeyArnOrKeyAliasType'
          - description: The <code>KeyARN</code> of the the wrapping key. This key encrypts or wraps the key under export for TR-31 key block generation.
      description: Parameter information for key material export using TR-31 standard.
    TagKeys:
      type: array
      items:
        $ref: '#/components/schemas/TagKey'
      minItems: 0
      maxItems: 200
    ExportKeyMaterial:
      type: object
      properties:
        Tr31KeyBlock:
          allOf:
          - $ref: '#/components/schemas/ExportTr31KeyBlock'
          - description: Parameter information for key material export using TR-31 standard.
        Tr34KeyBlock:
          allOf:
          - $ref: '#/components/schemas/ExportTr34KeyBlock'
          - description: Parameter information for key material export using TR-34 standard.
      description: Parameter information for key material export from Amazon Web Services Payment Cryptography.
    GetPublicKeyCertificateInput:
      type: object
      required:
      - KeyIdentifier
      title: GetPublicKeyCertificateInput
      properties:
        KeyIdentifier:
          allOf:
          - $ref: '#/components/schemas/KeyArnOrKeyAliasType'
          - description: The <code>KeyARN</code> of the asymmetric key pair.
    UpdateAliasInput:
      type: object
      required:
      - AliasName
      title: UpdateAliasInput
      properties:
        AliasName:
          allOf:
          - $ref: '#/components/schemas/AliasName'
          - description: The alias whose associated key is changing.
        KeyArn:
          allOf:
          - $ref: '#/components/schemas/KeyArn'
          - description: The <code>KeyARN</code> for the key that you are updating or removing from the alias.
    ListAliasesInput:
      type: object
      title: ListAliasesInput
      properties:
        MaxResults:
          allOf:
          - $ref: '#/components/schemas/MaxResults'
          - description: <p>Use this parameter to specify the maximum number of items to return. When this value is present, Amazon Web Services Payment Cryptography does not return more than the specified number of items, but it might return fewer.</p> <p>This value is optional. If you include a value, it must be between 1 and 100, inclusive. If you do not include a value, it defaults to 50.</p>
        NextToken:
          allOf:
          - $ref: '#/components/schemas/NextToken'
          - description: Use this parameter in a subsequent request after you receive a response with truncated results. Set it to the value of <code>NextToken</code> from the truncated response you just received.
    KeySummary:
      type: object
      required:
      - Enabled
      - Exportable
      - KeyArn
      - KeyAttributes
      - KeyCheckValue
      - KeyState
      properties:
        Enabled:
          allOf:
          - $ref: '#/components/schemas/Boolean'
          - description: 'Specifies whether the key is enabled. '
        Exportable:
          allOf:
          - $ref: '#/components/schemas/Boolean'
          - description: Specifies whether the key is exportable. This data is immutable after the key is created.
        KeyArn:
          allOf:
          - $ref: '#/components/schemas/KeyArn'
          - description: The Amazon Resource Name (ARN) of the key.
        KeyAttributes:
          allOf:
          - $ref: '#/components/schemas/KeyAttributes'
          - description: The role of the key, the algorithm it supports, and the cryptographic operations allowed with the key. This data is immutable after the key is created.
        KeyCheckValue:
          allOf:
          - $ref: '#/components/schemas/KeyCheckValue'
          - description: The key check value (KCV) is used to check if all parties holding a given key have the same key or to detect that a key has changed. Amazon Web Services Payment Cryptography calculates the KCV by using standard algorithms, typically by encrypting 8 or 16 bytes or "00" or "01" and then truncating the result to the first 3 bytes, or 6 hex digits, of the resulting cryptogram.
        KeyState:
          allOf:
          - $ref: '#/components/schemas/KeyState'
          - description: The state of an Amazon Web Services Payment Cryptography that is being created or deleted.
      description: Metadata about an Amazon Web Services Payment Cryptography key.
    DeleteKeyInputDeleteKeyInDaysInteger:
      type: integer
      minimum: 3
      maximum: 180
    TrustedCertificatePublicKey:
      type: object
      required:
      - CertificateAuthorityPublicKeyIdentifier
      - KeyAttributes
      - PublicKeyCertificate
      properties:
        CertificateAuthorityPublicKeyIdentifier:
