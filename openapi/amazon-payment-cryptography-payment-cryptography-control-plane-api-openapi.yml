    post:
      operationId: CreateAlias
      description: 'Creates an alias, or a friendly name, for an Amazon Web Services Payment Cryptography key. You can use an alias to identify a key in the console and when you call cryptographic operations such as EncryptData or DecryptData.


        You can associate the alias with any key in the same Amazon Web Services Region. Each alias is associated with only one key at a time, but a key can have multiple aliases. You can''t create an alias without a key. The alias must be unique in the account and Amazon Web Services Region, but you can create another alias with the same name in a different Amazon Web Services Region.


        To change the key that''s associated with the alias, call UpdateAlias. To delete the alias, call DeleteAlias. These operations don''t affect the underlying key. To get the alias that you created, call ListAliases.


        Cross-account use: This operation can''t be used across different Amazon Web Services accounts.


        Related operations:


        DeleteAlias


        GetAlias


        ListAliases


        UpdateAlias'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAliasOutput'
              examples:
                CreateAlias200Example:
                  summary: Default CreateAlias 200 response
